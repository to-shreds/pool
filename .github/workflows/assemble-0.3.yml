name: Assemble and verify Cue Lab 0.3
on:
  push:
    branches: [build-v0.3.0]
    paths: ['.release-transport/**', '.github/workflows/assemble-0.3.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-v0.3.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand checksum-verified tested source
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          root=pathlib.Path.cwd()
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip()=='build-v0.3.0'
          encoded=''.join((root/'.release-transport'/f'part-{i:02}.b64').read_text(encoding='ascii') for i in range(10))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='8a658c955451a02bb1313e9def9cea936643113a29d48e1bf0e4a0a495d05ee6'
          decoder=lzma.LZMADecompressor(memlimit=268435456)
          raw=decoder.decompress(packed,max_length=2097152)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(raw).hexdigest()=='101ba9344f01a4bd4ec94775c14b2ffaa69a70e507c86575784abebdfdf546e5'
          m=json.loads(raw)
          assert m['format']=='cue-lab-verified-text-delta-v1'
          assert m['base_commit']=='42ee495bea2d3ef63f08796c8d3d68dac8262b89'
          subprocess.run(['git','merge-base','--is-ancestor',m['base_commit'],'HEAD'],check=True)
          outputs=[]
          for f in m['files']:
              p=pathlib.PurePosixPath(f['path'])
              assert not p.is_absolute() and '..' not in p.parts and all(not x.startswith('.') for x in p.parts)
              target=root/p
              assert not target.is_symlink()
              old=target.read_bytes() if target.exists() else b''
              if 'base_sha256' in f:
                  assert hashlib.sha256(old).hexdigest()==f['base_sha256'],f['path']+' base hash'
              if 'base_git_blob' in f:
                  assert hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()==f['base_git_blob'],f['path']+' git base'
              if 'text' in f:
                  text=f['text']
              else:
                  source=old.decode('utf-8');parts=[]
                  for op in f['ops']:
                      if isinstance(op,str):parts.append(op)
                      else:
                          start,count=op
                          assert isinstance(start,int) and isinstance(count,int) and start>=0 and count>=0 and start+count<=len(source)
                          parts.append(source[start:start+count])
                  text=''.join(parts)
              out=text.encode('utf-8')
              assert len(out)==f['bytes'] and hashlib.sha256(out).hexdigest()==f['sha256'],f['path']+' output hash'
              outputs.append((target,out))
          for target,out in outputs:
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(out)
          (root/'.release-manifest.json').write_bytes(raw)
          print('Verified and expanded',len(outputs),'source files')
      - name: Build offline HTML and worker
        run: python3 build.py
      - name: Verify generated bytes
        shell: python
        run: |
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('.release-manifest.json').read_text())
          for path,expected in m['generated'].items():
              data=pathlib.Path(path).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected,path
          assert pathlib.Path('Cue-Lab.html').stat().st_size==m['offline_bytes']
          print('Generated worker and HTML match tested build byte-for-byte')
      - name: Run all 213 unit regressions
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.js | tee verification/unit-v0.3.txt
      - name: Run 256 varied equipment and table shots
        run: node verification/stress-v0.3.js
      - name: Record CI and commit normal source on build branch
        shell: python
        run: |
          import hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path.cwd();m=json.loads((root/'.release-manifest.json').read_text());log=(root/'verification/unit-v0.3.txt').read_text()
          assert re.search(r'^# pass 213$',log,re.M) and re.search(r'^# fail 0$',log,re.M)
          stress=json.loads((root/'verification/stress-v0.3-results.json').read_text())
          assert stress['accepted']==256 and not stress['failures']
          ci={'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'transport_commit':os.environ['GITHUB_SHA'],'unit_passed':213,'stress_accepted':256,'failures':0,'browser_tests_in_ci':False,'source_sha256':{f['path']:f['sha256'] for f in m['files']},'generated':m['generated'],'offline_bytes':m['offline_bytes']}
          (root/'verification/CI-v0.3.json').write_text(json.dumps(ci,indent=2)+'\n')
          paths=[f['path'] for f in m['files']]+['src/worker-bundle.js','verification/unit-v0.3.txt','verification/stress-v0.3-results.json','verification/CI-v0.3.json']
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+paths,check=True)
          subprocess.run(['git','commit','-m','Publish tested Cue Lab 0.3 source, generated worker and CI evidence'],check=True)
          subprocess.run(['git','push','origin','HEAD:build-v0.3.0'],check=True)
          print('Committed source',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Package complete normal source and offline game
        shell: python
        run: |
          import pathlib,subprocess,zipfile
          root=pathlib.Path.cwd()
          paths=subprocess.check_output(['git','ls-files','-z'],text=True).split('\0')
          with zipfile.ZipFile('Cue-Lab-source-v0.3.0.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:
                  if p and not p.startswith('.release-transport/') and p!='.github/workflows/assemble-0.3.yml':
                      z.write(root/p,'cue-lab/'+p)
              z.write(root/'Cue-Lab.html','cue-lab/Cue-Lab.html')
          print('Packaged source with preserved roadmap and generated offline HTML')
      - uses: actions/upload-artifact@v4
        with:
          name: Cue-Lab-0.3-verified
          path: |
            Cue-Lab-source-v0.3.0.zip
            Cue-Lab.html
            verification/CI-v0.3.json
          if-no-files-found: error
